<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Photo Viewer</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;
}

img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
}

.tap-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    z-index: 10;
}

.left { left: 0; }
.right { right: 0; }
</style>
</head>
<body>

<img id="photo" src="" alt="Photo Viewer">

<div class="tap-zone left" onclick="prevPhoto()"></div>
<div class="tap-zone right" onclick="nextPhoto()"></div>

<script>
const totalPhotos = 4; // total images in your photos folder
const photosPerCategory = 2; // how many photos in each category

// Automatically generate categories
const categories = [];
for(let i = 0; i < totalPhotos; i += photosPerCategory) {
    const category = [];
    for(let j = 1; j <= photosPerCategory; j++) {
        category.push(`photos/${i + j}.jpg`);
    }
    categories.push(category);
}

let currentCategory = 0;
let currentPhotoIndex = 0;
const photo = document.getElementById("photo");

function showPhoto() {
    photo.src = categories[currentCategory][currentPhotoIndex];
}

// Tap left/right to cycle within current category
function nextPhoto() {
    currentPhotoIndex++;
    if(currentPhotoIndex >= categories[currentCategory].length) currentPhotoIndex = 0;
    showPhoto();
}

function prevPhoto() {
    currentPhotoIndex--;
    if(currentPhotoIndex < 0) currentPhotoIndex = categories[currentCategory].length - 1;
    showPhoto();
}

// Swipe left/right to switch category
let startX = 0;
window.addEventListener("touchstart", e => startX = e.touches[0].clientX);
window.addEventListener("touchend", e => {
    const endX = e.changedTouches[0].clientX;
    if(endX - startX > 50) switchCategory(-1);   // swipe right → previous category
    else if(startX - endX > 50) switchCategory(1); // swipe left → next category
});

function switchCategory(direction) {
    currentCategory += direction;
    if(currentCategory < 0) currentCategory = categories.length - 1;
    else if(currentCategory >= categories.length) currentCategory = 0;

    currentPhotoIndex = 0; // reset to first photo in new category
    showPhoto();
}

// Resize image to fill viewport
function resizeImage() {
    const vh = window.innerHeight;
    photo.style.height = `${vh}px`;
}

window.addEventListener("resize", resizeImage);
window.addEventListener("orientationchange", resizeImage);
window.addEventListener("load", () => {
    resizeImage();
    showPhoto();
    setTimeout(() => window.scrollTo(0, 1), 100);
});
</script>

</body>
</html>
