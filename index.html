<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tap Photo Viewer</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    display: flex;
    justify-content: center;
    align-items: center;
}

img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    position: absolute;
    top: 0;
    left: 0;
}

.tap-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    z-index: 10;
}

.left { left: 0; }
.right { right: 0; }

</style>
</head>
<body>

<img id="photo" src="photos/1.jpg" alt="Photo Viewer">

<div class="tap-zone left" onclick="prev()"></div>
<div class="tap-zone right" onclick="next()"></div>

<script>
let current = 1;
const total = 2; // number of photos
const photo = document.getElementById("photo");

function show() {
    photo.src = `photos/${current}.jpg`;
}

// Tap navigation
function next() { current++; if(current > total) current = 1; show(); }
function prev() { current--; if(current < 1) current = total; show(); }

// Swipe navigation
let startX = 0;
window.addEventListener("touchstart", e => { startX = e.touches[0].clientX; });
window.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    if(endX - startX > 50) prev();       // swipe right
    else if(startX - endX > 50) next();  // swipe left
});

// Adjust image to fill visible viewport dynamically
function resizeImage() {
    const vh = window.innerHeight; // visible height (excluding URL bar)
    photo.style.height = `${vh}px`;
}

window.addEventListener("resize", resizeImage);
window.addEventListener("orientationchange", resizeImage);
window.addEventListener("load", () => {
    resizeImage();
    // optional tiny scroll to hide top bar
    setTimeout(() => window.scrollTo(0, 1), 100);
});

</script>

</body>
</html>
