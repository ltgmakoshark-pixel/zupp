<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Multi-Category Photo Viewer</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;
}

img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
}

.tap-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    z-index: 10;
}

.left { left: 0; }
.right { right: 0; }
</style>
</head>
<body>

<img id="photo" src="photos/category1-1.jpg" alt="Photo Viewer">

<div class="tap-zone left" onclick="prevPhoto()"></div>
<div class="tap-zone right" onclick="nextPhoto()"></div>

<script>
const categories = [
    ["photos/category1-1.jpg", "photos/category1-2.jpg"],
    ["photos/category2-1.jpg", "photos/category2-2.jpg"]
];

let currentCategory = 0;
let currentPhoto = 0;

const photo = document.getElementById("photo");

function showPhoto() {
    photo.src = categories[currentCategory][currentPhoto];
}

// Tap left/right to switch photo within category
function nextPhoto() {
    currentPhoto++;
    if (currentPhoto >= categories[currentCategory].length) currentPhoto = 0;
    showPhoto();
}

function prevPhoto() {
    currentPhoto--;
    if (currentPhoto < 0) currentPhoto = categories[currentCategory].length - 1;
    showPhoto();
}

// Swipe left/right to switch category
let startX = 0;
window.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});
window.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    if (endX - startX > 50) switchCategory(-1);  // swipe right
    else if (startX - endX > 50) switchCategory(1); // swipe left
});

function switchCategory(direction) {
    currentCategory += direction;
    if (currentCategory < 0) currentCategory = categories.length - 1;
    else if (currentCategory >= categories.length) currentCategory = 0;
    currentPhoto = 0; // reset photo index when switching category
    showPhoto();
}

// Adjust image height to visible viewport
function resizeImage() {
    const vh = window.innerHeight;
    photo.style.height = `${vh}px`;
}

window.addEventListener("resize", resizeImage);
window.addEventListener("orientationchange", resizeImage);
window.addEventListener("load", () => {
    resizeImage();
    showPhoto();
    setTimeout(() => window.scrollTo(0, 1), 100);
});
</script>

</body>
</html>
